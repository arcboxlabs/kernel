name: Build and Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Linux kernel version (e.g. 6.18.38)"
        required: false
        default: "6.18.38"
        type: string

permissions:
  contents: write

env:
  KERNEL_VERSION: ${{ github.event.inputs.kernel_version || '6.18.38' }}

jobs:
  # ==========================================================================
  # Build kernel for each architecture x flavor (native runners, no
  # cross-compile). `system` boots the VZ/HV System VM; `microvm` boots
  # Firecracker sandbox microVMs (arm64-only for now — Firecracker x86_64
  # needs an ELF vmlinux and its own config).
  # ==========================================================================
  build-kernel:
    name: Build Kernel (${{ matrix.arch }}, ${{ matrix.flavor }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: arm64
            flavor: system
            artifact: kernel-arm64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            flavor: system
            artifact: kernel-x86_64
            runner: ubuntu-24.04
          - arch: arm64
            flavor: microvm
            artifact: microvm-kernel-arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex \
            libssl-dev libelf-dev curl xz-utils

      - name: Download kernel source
        run: |
          curl -sL "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${{ env.KERNEL_VERSION }}.tar.xz" \
            | tar -xJ

      - name: Build kernel
        run: |
          USE_DOCKER=0 \
          ARCH=${{ matrix.arch }} \
          FLAVOR=${{ matrix.flavor }} \
          KERNEL_VERSION=${{ env.KERNEL_VERSION }} \
          OUTPUT_DIR="$(pwd)/output" \
          ./scripts/build-kernel.sh

      - name: Generate checksum
        run: |
          cd output
          sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            output/${{ matrix.artifact }}
            output/${{ matrix.artifact }}.sha256
          retention-days: 14

  # ==========================================================================
  # Create GitHub Release with bare kernel binaries (tag pushes only).
  # ==========================================================================
  release:
    name: Create Release
    needs: build-kernel
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          for NAME in kernel-arm64 kernel-x86_64 microvm-kernel-arm64; do
            DIR="artifacts/$NAME"
            if [ -f "$DIR/$NAME" ]; then
              cp "$DIR/$NAME" "release/$NAME"
              cp "$DIR/$NAME.sha256" "release/$NAME.sha256"
            fi
          done
          echo "=== Release files ==="
          ls -lh release/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## Kernel ${{ github.ref_name }}

            Self-compiled Linux kernel for ArcBox VMs (`CONFIG_MODULES=n`, all drivers built-in).

            ### Files
            - `kernel-arm64` — ARM64 Image, System VM (Apple Silicon / ARM VMs)
            - `kernel-x86_64` — x86_64 bzImage, System VM
            - `microvm-kernel-arm64` — ARM64 Image, Firecracker sandbox microVMs
          files: release/*
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}

      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: arcboxlabs
          repositories: boot-assets

      - name: Trigger boot-assets rebuild
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ steps.bot-token.outputs.token }}
          repository: arcboxlabs/boot-assets
          event-type: kernel-release
          client-payload: '{"kernel_tag": "${{ github.ref_name }}"}'
